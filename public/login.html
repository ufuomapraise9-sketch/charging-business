<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Staff sign in · ChargeDesk</title>
    <link rel="stylesheet" href="/login.css">
    <script defer src="/login.js"></script>
  </head>
  <body>
    <main class="login-shell">
      <a class="brand" href="/login.html"><span class="brand-mark">⚡</span><span><strong>ChargeDesk</strong><small>Just Electricals · Staff access</small></span></a>
      <section class="login-card">
        <p class="eyebrow">STAFF ACCESS</p>
        <h1>Welcome back</h1>
        <p class="intro">Sign in to manage charging jobs and socket records.</p>
        <form id="login-form">
          <label for="password">Staff passphrase</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="16" required autofocus>
          <p id="login-error" class="error" role="alert"></p>
          <button type="submit">Sign in <span>→</span></button>
        </form>
        <p class="privacy-note">Your sign-in is protected by a secure session. Never share the staff passphrase with customers.</p>
      </section>
      <footer>ChargeDesk · Secure staff access</footer>
    </main>
  </body>
</html>
